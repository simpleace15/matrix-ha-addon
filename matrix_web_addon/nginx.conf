worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip compression for JS/CSS/HTML/JSON/SVG
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff2
        application/wasm;

    server {
        listen 8080;
        server_name _;
        root /app/webapp;
        index index.html;

        # Allow embedding in HA Ingress iframe
        # HA Ingress uses same-origin, so X-Frame-Options SAMEORIGIN is safe.
        # No restrictive Content-Security-Policy: frame-ancestors that would block Ingress.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # config.json should never be cached (it's patched at startup)
        location = /config.json {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            expires off;
        }

        # Cache static assets (hashed filenames — safe to cache aggressively)
        location ~* \.(js|css|woff2|wasm|png|jpg|jpeg|gif|svg|ico|map)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            access_log off;
        }

        # SPA routing — all paths fall back to index.html
        # Inject a cookie to bypass Element Web's mobile redirect.
        # Element Web checks navigator.userAgent for iOS/Android and redirects
        # to mobile_guide/ unless cookie "element_mobile_redirect_to_guide=false"
        # is set. The HA Companion app sends a mobile user agent, so we need
        # this cookie set before Element's JS runs.
        location / {
            try_files $uri $uri/ /index.html;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "no-cache" always;

            # Inject a script into index.html that sets the bypass cookie
            sub_filter '</head>' '<script>document.cookie="element_mobile_redirect_to_guide=false;path=/;max-age=31536000";</script></head>';
            sub_filter_once on;
            sub_filter_types text/html;
        }
    }
}