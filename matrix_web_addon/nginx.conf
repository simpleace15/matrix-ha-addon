worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip compression for JS/CSS/HTML/JSON/SVG
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff2
        application/wasm;

    # Cache static assets (hashed filenames — safe to cache aggressively)
    map $uri $cache_control {
        default "no-cache";
        ~* \.(js|css|woff2|wasm|png|jpg|jpeg|gif|svg|ico|map)$ "public, max-age=31536000, immutable";
        ~* \.(html)$ "no-cache";
    }

    server {
        listen 8080;
        server_name _;
        root /app/webapp;
        index index.html;

        # Allow embedding in HA Ingress iframe
        # HA Ingress uses same-origin, so X-Frame-Options SAMEORIGIN is safe.
        # No restrictive Content-Security-Policy: frame-ancestors that would block Ingress.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # SPA routing — all paths fall back to index.html
        location / {
            try_files $uri $uri/ /index.html;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control $cache_control;
        }

        # Cache static assets
        location ~* \.(js|css|woff2|wasm|png|jpg|jpeg|gif|svg|ico|map)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Frame-Options "SAMEORIGIN" always;
            access_log off;
        }

        # config.json should never be cached (it's patched at startup)
        location = /config.json {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            expires off;
        }
    }
}