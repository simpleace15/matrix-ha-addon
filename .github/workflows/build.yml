name: Build Image

on:
  push:
    branches: [main]
    paths:
      - 'matrix_web_addon/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'matrix_web_addon/**'
      - '.github/workflows/build.yml'

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: matrix-web-addon
  REGISTRY_PREFIX: ghcr.io/simpleace15

permissions:
  contents: read

jobs:
  init:
    name: Initialize build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract addon version from config.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' matrix_web_addon/config.yaml | sed 's/version: *"\(.*\)"/\1/')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Addon version: ${VERSION}"

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}
          registry-prefix: ${{ env.REGISTRY_PREFIX }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ${{ github.workspace }}/matrix_web_addon
          file: ${{ github.workspace }}/matrix_web_addon/Dockerfile
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          push: ${{ github.event_name == 'push' }}
          version: ${{ needs.init.outputs.version }}
          build-args: |
            ELEMENT_WEB_VERSION=v1.12.24
          cosign: "false"
          cosign-base-verify: "false"

  manifest:
    name: Publish multi-arch manifest
    needs: [init, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          registry-prefix: ${{ env.REGISTRY_PREFIX }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest