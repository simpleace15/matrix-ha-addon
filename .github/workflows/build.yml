name: Build Image

on:
  push:
    branches: [main]
    paths:
      - 'matrix_web_addon/**'
      - '.github/workflows/build.yml'
  release:
    types: [published]

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: matrix-web-addon

permissions:
  contents: read

jobs:
  init:
    name: Initialize build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract addon version
        id: version
        run: |
          VERSION=$(jq -r '.version' matrix_web_addon/config.yaml)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Addon version: ${VERSION}"

      - name: Get build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          push: "true"
          # Element Web version passed as Docker build arg
          build-args: |
            ELEMENT_WEB_VERSION=v1.12.24
          # Build context is the addon directory (where Dockerfile lives)
          context: ${{ github.workspace }}/matrix_web_addon
          file: ${{ github.workspace }}/matrix_web_addon/Dockerfile
          # Disable cosign signing (we don't need signed images for a personal addon)
          cosign: "false"
          # Don't verify base image signature (our base images aren't cosign-signed)
          cosign-base-verify: "false"

  manifest:
    name: Publish multi-arch manifest
    needs: [init, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest