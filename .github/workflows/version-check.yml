name: Version Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'matrix_web_addon/**'

permissions:
  contents: read

jobs:
  check-version-bump:
    name: Verify version was bumped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history to diff against main

      - name: Check if version changed
        id: version-check
        run: |
          # Get the version in the PR branch
          NEW_VERSION=$(grep '^version:' matrix_web_addon/config.yaml | sed 's/version: *"\(.*\)"/\1/')
          echo "New version: $NEW_VERSION"

          # Get the version on main (the base branch)
          BASE_VERSION=$(git show origin/main:matrix_web_addon/config.yaml 2>/dev/null | grep '^version:' | sed 's/version: *"\(.*\)"/\1/')
          echo "Base version: $BASE_VERSION"

          if [ -z "$BASE_VERSION" ]; then
            echo "No prior version found (first commit?) — skipping check"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$NEW_VERSION" = "$BASE_VERSION" ]; then
            echo "::error::Version was not bumped! config.yaml still has $NEW_VERSION. Bump the version (YYYY.MM.DD format) so HA Supervisor detects the update."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "Version bumped: $BASE_VERSION → $NEW_VERSION ✓"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Check Dockerfile label matches
        if: steps.version-check.outputs.skip != 'true'
        run: |
          CONFIG_VERSION=$(grep '^version:' matrix_web_addon/config.yaml | sed 's/version: *"\(.*\)"/\1/')
          DOCKERFILE_VERSION=$(grep 'io.hass.version=' matrix_web_addon/Dockerfile | sed 's/.*io.hass.version="\([^"]*\)".*/\1/')
          echo "config.yaml: $CONFIG_VERSION"
          echo "Dockerfile:  $DOCKERFILE_VERSION"
          if [ "$CONFIG_VERSION" != "$DOCKERFILE_VERSION" ]; then
            echo "::error::Version mismatch! config.yaml has $CONFIG_VERSION but Dockerfile has $DOCKERFILE_VERSION. Both must match."
            exit 1
          fi
          echo "Versions match ✓"